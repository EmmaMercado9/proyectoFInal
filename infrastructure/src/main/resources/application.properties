spring.application.name=infrastructure

# Secretos locales (opcional, gitignored). En producción se usan variables de entorno.
spring.config.import=optional:classpath:application-local.properties

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/negocio}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# update: crea/actualiza tablas sin borrar datos. (create-drop borraba todo al reiniciar)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT — JWT_SECRET en Base64, mínimo 32 bytes. Generar: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# CORS — frontend Angular. En producción: CORS_ORIGINS=https://mitienda.com
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Días para aceptar devoluciones y cambios desde la fecha de venta
app.devoluciones.plazo-dias=${DEVOLUCION_PLAZO_DIAS:3}

# Facturación electrónica ARCA (ver FACTURACION-ARCA.md). Desactivada hasta configurar.
arca.enabled=${ARCA_ENABLED:false}
arca.ambiente=${ARCA_AMBIENTE:HOMOLOGACION}
arca.cuit=${ARCA_CUIT:}
arca.punto-venta=${ARCA_PUNTO_VENTA:}
arca.cert-path=${ARCA_CERT_PATH:}
arca.key-path=${ARCA_KEY_PATH:}
arca.razon-social=${ARCA_RAZON_SOCIAL:}
arca.domicilio=${ARCA_DOMICILIO:}
arca.iibb=${ARCA_IIBB:}
arca.inicio-actividades=${ARCA_INICIO_ACTIVIDADES:}
